_version: 2
# All translations for thag_md_view.
# Keys use the dot-separated paths matching the t!() macro calls in the source.
#
# Locales:
#   af  Afrikaans      bg  Bulgarian      ca  Catalan
#   cs  Czech          cy  Welsh          da  Danish
#   de  German         el  Greek          en  English
#   es  Spanish        fi  Finnish        fr  French
#   hr  Croatian       hu  Hungarian      it  Italian
#   nb  Norwegian      nl  Dutch          no  Norwegian
#   pl  Polish         pt  Portuguese     ro  Romanian
#   ru  Russian        sk  Slovak         sl  Slovenian
#   st  Sesotho        sv  Swedish        uk  Ukrainian
#   xh  Xhosa          zu  Zulu
#
# NOTE: Zulu (zu), Sesotho (st) and Xhosa (xh) translations are a best-effort
# first pass; review by native speakers is recommended before considering them
# production-ready.

