    # Преглед на Markdown — Помощ

    ## Клавишни Комбинации

    ### Файл
    | Клавиш | Действие |
    |---|---|
    | Cmd/Ctrl-o | Отваряне на файл Markdown |
    | Cmd/Ctrl-r | Опресняване — презареждане на текущия файл от диска |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Изход |

    Прегледачът следи текущия файл за промени и го презарежда автоматично.
    Използвайте `--no-detach` или `--foreground` в командния ред, за да остане свързан с терминала (само Unix).

    ### Навигация
    | Клавиш | Действие |
    |---|---|
    | Бутони ◀ / ▶ | Назад / Напред в историята |
    | Cmd/Ctrl-t | Показване/скриване на панела за съдържание |

    ### Търсене
    | Клавиш | Действие |
    |---|---|
    | Cmd/Ctrl-f | Отваряне / затваряне на лентата за търсене |
    | Enter  или  бутон ⬇ | Следващо съвпадение |
    | Shift-Enter  или  бутон ⬆ | Предишно съвпадение |
    | Escape | Затваряне на лентата за търсене |

    > Търсенето навигира до раздела, съдържащ всяко съвпадение, и маркира намерения текст.
    > Активното съвпадение е показано в оранжево; другите в жълто.

    ### Автоматично презареждане
    Прегледачът следи отворения файл за промени на диска и го презарежда автоматично.
    След всяко автоматично презареждане се появява кратко известие «↻ Презаредено» в лентата с инструменти.

    ### Мащаб и Шрифт
    | Клавиш | Действие |
    |---|---|
    | Cmd/Ctrl-= | Увеличаване |
    | Cmd/Ctrl-− | Намаляване |
    | Cmd/Ctrl-z | Нулиране на мащаба до 100% |
    | Cmd/Ctrl-Shift-a | Увеличаване на шрифта |
    | Cmd/Ctrl-a | Намаляване на шрифта |
    | Cmd/Ctrl-0 | Нулиране на размера на шрифта до 100% |

    ### Превъртане (когато няма фокусирано текстово поле)
    | Клавиш | Действие |
    |---|---|
    | Стрелка нагоре / надолу | Превъртане с един ред |
    | Page Up / Page Down | Превъртане с един изглед (Fn-Нагоре / Fn-Надолу на Mac) |
    | Home / Cmd-Нагоре | Скачане в началото на документа (Fn-Наляво на Mac) |
    | End / Cmd-Надолу | Скачане в края на документа (Fn-Надясно на Mac) |

    ### Помощ
    | Клавиш | Действие |
    |---|---|
    | F1 | Показване/скриване на този екран с помощ |
