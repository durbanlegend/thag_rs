    # Umbukeli wase-Markdown — Usizo

    ## Izinqamuleli Zeklawubhodi

    ### Ifayili
    | Ikhiye | Isenzo |
    |---|---|
    | Cmd/Ctrl-o | Vula ifayili ye-Markdown |
    | Cmd/Ctrl-r | Vuselela — layisha kabusha ifayili yamanje kudiski |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Phuma |

    Umbukeli ugada ifayili yamanje ukuze athole izinguquko futhi ayilavishe kabusha ngokuzenzakalelayo.
    Sebenzisa `--no-detach` noma `--foreground` emugqeni wemiyalo ukuze uhlale uxhunyiwe ethalini (Unix kuphela).

    ### Ukuzulazula
    | Ikhiye | Isenzo |
    |---|---|
    | Izinkinobho ◀ / ▶ | Emuva / Phambili emlando |
    | Cmd/Ctrl-t | Bonisa/fihla iphaneli yohlu lwezindikimba |

    ### Ukusesha
    | Ikhiye | Isenzo |
    |---|---|
    | Cmd/Ctrl-f | Vula / vala ibha yokusesha |
    | Enter  noma  inkinobho ⬇ | Ukufanelana okulandelayo |
    | Shift-Enter  noma  inkinobho ⬆ | Ukufanelana kwangaphambilini |
    | Escape | Vala ibha yokusesha |

    > Ukusesha kuzulazula kuya engxenyeni equkethe ukufanelana ngakunye futhi kugqamise umbhalo otholakele.
    > Ukufanelana okusebenzayo kuboniswa ngombala we-orenje; okunye ngombala omthubi.

    ### Ukuphinda Kulayishwa Ngokuzenzakalelayo
    Umbukeli ugada ifayili evuliwe ukuze athole izinguquko kudiski futhi ayilavishe kabusha ngokuzenzakalelayo.
    Isaziso esifushane «↻ Ilayishiwe kabusha» sivela ebalosebenzisi ngemuva kokuyilavishe kabusha ngakunye.

    ### Ukusondeza Nokushintsha Uhlobo Lombhalo
    | Ikhiye | Isenzo |
    |---|---|
    | Cmd/Ctrl-= | Sondeza |
    | Cmd/Ctrl-− | Nciphisa |
    | Cmd/Ctrl-z | Buyisela ukusondeza ku-100% |
    | Cmd/Ctrl-Shift-a | Khulisa uhlobo lombhalo |
    | Cmd/Ctrl-a | Nciphisa uhlobo lombhalo |
    | Cmd/Ctrl-0 | Buyisela uhlobo lombhalo ku-100% |

    ### Ukuskrola (uma kungekho inkundla yombhalo egxilisiwe)
    | Ikhiye | Isenzo |
    |---|---|
    | Umcibisholo phezulu / phansi | Skrola umugqa owodwa |
    | Page Up / Page Down | Skrola umbukeli owodwa (Fn-Phezulu / Fn-Phansi ku-Mac) |
    | Home / Cmd-Phezulu | Yiya ekuqaleni kwedokhumenti (Fn-Kwesokunxele ku-Mac) |
    | End / Cmd-Phansi | Yiya ekupheleni kwedokhumenti (Fn-Kwesokudla ku-Mac) |

    ### Usizo
    | Ikhiye | Isenzo |
    |---|---|
    | F1 | Bonisa/fihla lesi sikrini sosizo |
