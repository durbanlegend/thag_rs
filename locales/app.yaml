    # Markdown-kyker — Hulp

    ## Sleutelbordkortpaaie

    ### Lêer
    | Sleutel | Aksie |
    |---|---|
    | Cmd/Ctrl-o | Maak 'n Markdown-lêer oop |
    | Cmd/Ctrl-r | Verfris — herlaai die huidige lêer van skyf |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Verlaat |

    Die kyker dophou die huidige lêer vir veranderinge en herlaai outomaties.
    Gebruik `--no-detach` of `--foreground` op die opdragreël om dit aan die terminaal gekoppel te hou (slegs Unix).

    ### Navigasie
    | Sleutel | Aksie |
    |---|---|
    | Knoppies ◀ / ▶ | Terug / Vorentoe in geskiedenis |
    | Cmd/Ctrl-t | Wissel inhoudsopgawe-paneel |

    ### Soektog
    | Sleutel | Aksie |
    |---|---|
    | Cmd/Ctrl-f | Maak soekbalk oop / toe |
    | Enter  of  knoppie ⬇ | Volgende treffer |
    | Shift-Enter  of  knoppie ⬆ | Vorige treffer |
    | Escape | Sluit soekbalk |

    > Soektog navigeer na die afdeling wat elke treffer bevat en merk die gevonde teks.
    > Die aktiewe treffer word oranje gewys; ander in geel.

    ### Outomatiese herlaai
    Die kyker dophou die oop lêer vir skyfveranderinge en herlaai dit outomaties.
    'n Kort «↻ Herlaai» kennisgewing verskyn in die nutsbalk na elke outomatiese herlaai.

    ### Zoom en Lettertipe
    | Sleutel | Aksie |
    |---|---|
    | Cmd/Ctrl-= | Zoem in |
    | Cmd/Ctrl-− | Zoem uit |
    | Cmd/Ctrl-z | Stel zoom na 100% terug |
    | Cmd/Ctrl-Shift-a | Vergroot lettertipe |
    | Cmd/Ctrl-a | Verklein lettertipe |
    | Cmd/Ctrl-0 | Stel lettertipegrootte na 100% terug |

    ### Blaai (wanneer geen teksveld gefokus is)
    | Sleutel | Aksie |
    |---|---|
    | Op / Af pyl | Blaai een reël |
    | Page Up / Page Down | Blaai een venster (Fn-Op / Fn-Af op Mac) |
    | Home / Cmd-Op | Spring na bokant van dokument (Fn-Links op Mac) |
    | End / Cmd-Af | Spring na onderkant van dokument (Fn-Regs op Mac) |

    ### Hulp
    | Sleutel | Aksie |
    |---|---|
    | F1 | Wissel hierdie hulpskerm |
