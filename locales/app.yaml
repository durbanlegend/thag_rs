    # Seboni sa Markdown — Thuso

    ## Likhutlo tsa Setala

    ### Faele
    | Sehlooho | Ketso |
    |---|---|
    | Cmd/Ctrl-o | Bula faele ea Markdown |
    | Cmd/Ctrl-r | Mpshafatsa — tlatsa faele ea jwale ho tsoa desteng |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Tsoa |

    Seboni se lebeletse faele ea jwale bakeng sa liphetoho 'me se e tlatsa bocha ka ho iphepa.
    Sebedisa `--no-detach` kapa `--foreground` mollaong oa taelo ho se boloka se kgokahanye le terminal (Unix feela).

    ### Ho Khomarela
    | Sehlooho | Ketso |
    |---|---|
    | Likonopo ◀ / ▶ | Morao / Pele molalong oa nalane |
    | Cmd/Ctrl-t | Bontša/Patela sepata sa lenane la litlhophelo |

    ### Ho Batla
    | Sehlooho | Ketso |
    |---|---|
    | Cmd/Ctrl-f | Bula / koala bha ea ho batla |
    | Enter  kapa  konopo ⬇ | Tšoantšo e latelang |
    | Shift-Enter  kapa  konopo ⬆ | Tšoantšo e fetileng |
    | Escape | Koala bha ea ho batla |

    > Ho batla ho ea karolong e nang le tšoantšo ka 'ngoe 'me ho hlokomela mongolo o fumanehileng.
    > Tšoantšo e sebetsang e bontšoa ka bochabeng; tse ling ka yellow.

    ### Ho Tlatsa Bocha ka Ho Iphepa
    Seboni se lebeletse faele e buletsoeng bakeng sa liphetoho desteng 'me se e tlatsa bocha ka ho iphepa.
    Tsebišo e khuts'oane «↻ E tsotlehilwe bocha» e hlaha baeng ba lisebelisoa ka mor'a ho tlatsa bocha ka ho iphepa 'ngoe le 'ngoe.

    ### Holimo le Mongolo
    | Sehlooho | Ketso |
    |---|---|
    | Cmd/Ctrl-= | Holisa |
    | Cmd/Ctrl-− | Fokotsa |
    | Cmd/Ctrl-z | Busa holimo ho 100% |
    | Cmd/Ctrl-Shift-a | Hola mongolo |
    | Cmd/Ctrl-a | Fokotsa mongolo |
    | Cmd/Ctrl-0 | Busa mongolo ho 100% |

    ### Ho Potoloha (ha ho na tšepo ea mongolo e kgomaretsoeng)
    | Sehlooho | Ketso |
    |---|---|
    | Motsu o holimo / tlase | Potolohisa mola o le mong |
    | Page Up / Page Down | Potolohisa seboni se le seng (Fn-Holimo / Fn-Tlase Mac) |
    | Home / Cmd-Holimo | Ea qalong ea tokomane (Fn-Nngele Mac) |
    | End / Cmd-Tlase | Ea pheletsong ea tokomane (Fn-Nngele ea Nngele Mac) |

    ### Thuso
    | Sehlooho | Ketso |
    |---|---|
    | F1 | Bontša/Patela skrini ena ea thuso |
