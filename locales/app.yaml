help.text:
  en: |
    # Markdown Viewer — Help

    ## Keyboard Shortcuts

    ### File
    | Key | Action |
    |---|---|
    | Cmd/Ctrl-o | Open a markdown file |
    | Cmd/Ctrl-r | Refresh — reload the current file from disk |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Quit |

    The viewer watches the current file for changes and reloads automatically.
    Use `--no-detach` or `--foreground` on the command line to keep it attached to the terminal (Unix only).

    ### Navigation
    | Key | Action |
    |---|---|
    | ◀ / ▶ buttons | Back / Forward in history |
    | Cmd/Ctrl-t | Toggle the table of contents panel |

    ### Search
    | Key | Action |
    |---|---|
    | Cmd/Ctrl-f | Open / close the search bar |
    | Enter  or  ⬇ button | Next match |
    | Shift-Enter  or  ⬆ button | Previous match |
    | Escape | Close the search bar |

    > Search navigates to the section containing each match and highlights matched text inline.
    > The active match is shown in orange; other matches in yellow.

    ### Auto-reload
    The viewer watches the open file for changes on disk and reloads it automatically.
    A brief "↻ Reloaded" notice appears in the toolbar after each auto-reload.

    ### Zoom & Font
    | Key | Action |
    |---|---|
    | Cmd/Ctrl-= | Zoom in |
    | Cmd/Ctrl-− | Zoom out |
    | Cmd/Ctrl-z | Reset zoom to 100% |
    | Cmd/Ctrl-Shift-a | Enlarge font |
    | Cmd/Ctrl-a | Reduce font |
    | Cmd/Ctrl-0 | Reset font to 100% |

    ### Scrolling (when no text field is focused)
    | Key | Action |
    |---|---|
    | Up / Down arrow | Scroll one line |
    | Page Up / Page Down | Scroll one viewport (Fn-Up / Fn-Down on Mac) |
    | Home / Cmd-Up | Jump to top of document (Fn-Left on Mac) |
    | End / Cmd-Down | Jump to bottom of document (Fn-Right on Mac) |

    ### Help
    | Key | Action |
    |---|---|
    | F1 | Toggle this help screen |
  de: |
    # Markdown-Betrachter — Hilfe

    ## Tastaturkürzel

    ### Datei
    | Taste | Aktion |
    |---|---|
    | Cmd/Strg-o | Eine Markdown-Datei öffnen |
    | Cmd/Strg-r | Aktualisieren — aktuelle Datei vom Datenträger neu laden |
    | Cmd/Strg-w  /  Cmd/Strg-q | Beenden |

    Der Betrachter überwacht die aktuelle Datei auf Änderungen und lädt sie automatisch neu.
    Verwenden Sie `--no-detach` oder `--foreground` in der Kommandozeile, um die Verbindung zum Terminal aufrechtzuerhalten (nur Unix).

    ### Navigation
    | Taste | Aktion |
    |---|---|
    | Schaltflächen ◀ / ▶ | Zurück / Vorwärts im Verlauf |
    | Cmd/Strg-t | Inhaltsverzeichnis-Panel ein-/ausblenden |

    ### Suche
    | Taste | Aktion |
    |---|---|
    | Cmd/Strg-f | Suchleiste öffnen / schließen |
    | Eingabe  oder  Schaltfläche ⬇ | Nächster Treffer |
    | Umschalt-Eingabe  oder  Schaltfläche ⬆ | Vorheriger Treffer |
    | Escape | Suchleiste schließen |

    > Die Suche navigiert zum Abschnitt, der den jeweiligen Treffer enthält, und hebt den gefundenen Text hervor.
    > Der aktive Treffer wird orange angezeigt; andere Treffer in Gelb.

    ### Automatisches Neu-Laden
    Der Betrachter überwacht die geöffnete Datei auf Änderungen und lädt sie automatisch neu.
    Nach jedem automatischen Neu-Laden erscheint kurz eine „↻ Neu geladen"-Meldung in der Symbolleiste.

    ### Zoom und Schrift
    | Taste | Aktion |
    |---|---|
    | Cmd/Strg-= | Vergrößern |
    | Cmd/Strg-− | Verkleinern |
    | Cmd/Strg-z | Zoom auf 100 % zurücksetzen |
    | Cmd/Strg-Umschalt-a | Schrift vergrößern |
    | Cmd/Strg-a | Schrift verkleinern |
    | Cmd/Strg-0 | Schrift auf 100 % zurücksetzen |

    ### Scrollen (wenn kein Textfeld fokussiert ist)
    | Taste | Aktion |
    |---|---|
    | Pfeiltaste hoch / runter | Eine Zeile scrollen |
    | Bild hoch / Bild runter | Ein Viewport scrollen (Fn-Hoch / Fn-Runter auf Mac) |
    | Pos1 / Cmd-Hoch | Zum Anfang des Dokuments springen (Fn-Links auf Mac) |
    | Ende / Cmd-Runter | Zum Ende des Dokuments springen (Fn-Rechts auf Mac) |

    ### Hilfe
    | Taste | Aktion |
    |---|---|
    | F1 | Diesen Hilfebildschirm ein-/ausblenden |
  fr: |
    # Visionneuse Markdown — Aide

    ## Raccourcis Clavier

    ### Fichier
    | Touche | Action |
    |---|---|
    | Cmd/Ctrl-o | Ouvrir un fichier Markdown |
    | Cmd/Ctrl-r | Actualiser — recharger le fichier depuis le disque |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Quitter |

    La visionneuse surveille le fichier courant et le recharge automatiquement en cas de modification.
    Utilisez `--no-detach` ou `--foreground` en ligne de commande pour rester attaché au terminal (Unix uniquement).

    ### Navigation
    | Touche | Action |
    |---|---|
    | Boutons ◀ / ▶ | Précédent / Suivant dans l'historique |
    | Cmd/Ctrl-t | Afficher/masquer le panneau de la table des matières |

    ### Recherche
    | Touche | Action |
    |---|---|
    | Cmd/Ctrl-f | Ouvrir / fermer la barre de recherche |
    | Entrée  ou  bouton ⬇ | Correspondance suivante |
    | Maj-Entrée  ou  bouton ⬆ | Correspondance précédente |
    | Échap | Fermer la barre de recherche |

    > La recherche navigue vers la section contenant chaque résultat et surligne le texte correspondant.
    > Le résultat actif est affiché en orange ; les autres en jaune.

    ### Rechargement automatique
    La visionneuse surveille le fichier ouvert pour détecter les modifications sur le disque et le recharge automatiquement.
    Une brève notification « ↻ Rechargé » apparaît dans la barre d'outils après chaque rechargement automatique.

    ### Zoom et Police
    | Touche | Action |
    |---|---|
    | Cmd/Ctrl-= | Zoom avant |
    | Cmd/Ctrl-− | Zoom arrière |
    | Cmd/Ctrl-z | Réinitialiser le zoom à 100 % |
    | Cmd/Ctrl-Maj-a | Agrandir la police |
    | Cmd/Ctrl-a | Réduire la police |
    | Cmd/Ctrl-0 | Réinitialiser la police à 100 % |

    ### Défilement (quand aucun champ de texte n'est actif)
    | Touche | Action |
    |---|---|
    | Flèche haut / bas | Défiler d'une ligne |
    | Page préc. / Page suiv. | Défiler d'un écran (Fn-Haut / Fn-Bas sur Mac) |
    | Début / Cmd-Haut | Aller au début du document (Fn-Gauche sur Mac) |
    | Fin / Cmd-Bas | Aller à la fin du document (Fn-Droite sur Mac) |

    ### Aide
    | Touche | Action |
    |---|---|
    | F1 | Afficher/masquer cet écran d'aide |
  es: |
    # Visor de Markdown — Ayuda

    ## Atajos de Teclado

    ### Archivo
    | Tecla | Acción |
    |---|---|
    | Cmd/Ctrl-o | Abrir un archivo Markdown |
    | Cmd/Ctrl-r | Actualizar — recargar el archivo actual desde el disco |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Salir |

    El visor monitorea el archivo actual en busca de cambios y lo recarga automáticamente.
    Use `--no-detach` o `--foreground` en la línea de comandos para mantenerlo conectado al terminal (solo Unix).

    ### Navegación
    | Tecla | Acción |
    |---|---|
    | Botones ◀ / ▶ | Atrás / Adelante en el historial |
    | Cmd/Ctrl-t | Mostrar/ocultar el panel de tabla de contenidos |

    ### Búsqueda
    | Tecla | Acción |
    |---|---|
    | Cmd/Ctrl-f | Abrir / cerrar la barra de búsqueda |
    | Intro  o  botón ⬇ | Coincidencia siguiente |
    | Mayús-Intro  o  botón ⬆ | Coincidencia anterior |
    | Escape | Cerrar la barra de búsqueda |

    > La búsqueda navega a la sección que contiene cada coincidencia y resalta el texto encontrado.
    > La coincidencia activa se muestra en naranja; las demás en amarillo.

    ### Recarga automática
    El visor monitorea el archivo abierto en busca de cambios en el disco y lo recarga automáticamente.
    Tras cada recarga automática aparece brevemente el aviso «↻ Recargado» en la barra de herramientas.

    ### Zoom y Fuente
    | Tecla | Acción |
    |---|---|
    | Cmd/Ctrl-= | Acercar |
    | Cmd/Ctrl-− | Alejar |
    | Cmd/Ctrl-z | Restablecer zoom al 100 % |
    | Cmd/Ctrl-Mayús-a | Agrandar fuente |
    | Cmd/Ctrl-a | Reducir fuente |
    | Cmd/Ctrl-0 | Restablecer fuente al 100 % |

    ### Desplazamiento (cuando ningún campo de texto está enfocado)
    | Tecla | Acción |
    |---|---|
    | Flecha arriba / abajo | Desplazar una línea |
    | Re Pág / Av Pág | Desplazar un viewport (Fn-Arriba / Fn-Abajo en Mac) |
    | Inicio / Cmd-Arriba | Ir al principio del documento (Fn-Izquierda en Mac) |
    | Fin / Cmd-Abajo | Ir al final del documento (Fn-Derecha en Mac) |

    ### Ayuda
    | Tecla | Acción |
    |---|---|
    | F1 | Mostrar/ocultar esta pantalla de ayuda |
  pt: |
    # Visualizador de Markdown — Ajuda

    ## Atalhos de Teclado

    ### Arquivo
    | Tecla | Ação |
    |---|---|
    | Cmd/Ctrl-o | Abrir um arquivo Markdown |
    | Cmd/Ctrl-r | Atualizar — recarregar o arquivo atual do disco |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Sair |

    O visualizador monitora o arquivo atual em busca de alterações e o recarrega automaticamente.
    Use `--no-detach` ou `--foreground` na linha de comando para mantê-lo conectado ao terminal (somente Unix).

    ### Navegação
    | Tecla | Ação |
    |---|---|
    | Botões ◀ / ▶ | Voltar / Avançar no histórico |
    | Cmd/Ctrl-t | Alternar o painel do índice |

    ### Pesquisa
    | Tecla | Ação |
    |---|---|
    | Cmd/Ctrl-f | Abrir / fechar a barra de pesquisa |
    | Enter  ou  botão ⬇ | Próxima correspondência |
    | Shift-Enter  ou  botão ⬆ | Correspondência anterior |
    | Escape | Fechar a barra de pesquisa |

    > A pesquisa navega até a seção que contém cada correspondência e destaca o texto encontrado.
    > A correspondência ativa é exibida em laranja; as demais em amarelo.

    ### Recarga automática
    O visualizador monitora o arquivo aberto em busca de alterações no disco e o recarrega automaticamente.
    Um breve aviso «↻ Recarregado» aparece na barra de ferramentas após cada recarga automática.

    ### Zoom e Fonte
    | Tecla | Ação |
    |---|---|
    | Cmd/Ctrl-= | Ampliar |
    | Cmd/Ctrl-− | Reduzir zoom |
    | Cmd/Ctrl-z | Redefinir zoom para 100% |
    | Cmd/Ctrl-Shift-a | Aumentar fonte |
    | Cmd/Ctrl-a | Reduzir fonte |
    | Cmd/Ctrl-0 | Redefinir fonte para 100% |

    ### Rolagem (quando nenhum campo de texto está em foco)
    | Tecla | Ação |
    |---|---|
    | Seta para cima / baixo | Rolar uma linha |
    | Page Up / Page Down | Rolar um viewport (Fn-Cima / Fn-Baixo no Mac) |
    | Home / Cmd-Cima | Ir ao início do documento (Fn-Esquerda no Mac) |
    | End / Cmd-Baixo | Ir ao final do documento (Fn-Direita no Mac) |

    ### Ajuda
    | Tecla | Ação |
    |---|---|
    | F1 | Alternar esta tela de ajuda |
  sv: |
    # Markdown-visare — Hjälp

    ## Tangentbordsgenvägar

    ### Fil
    | Tangent | Åtgärd |
    |---|---|
    | Cmd/Ctrl-o | Öppna en Markdown-fil |
    | Cmd/Ctrl-r | Uppdatera — läs in aktuell fil från disk igen |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Avsluta |

    Visaren bevakar den aktuella filen för ändringar och läser in den automatiskt.
    Använd `--no-detach` eller `--foreground` på kommandoraden för att hålla den kopplad till terminalen (endast Unix).

    ### Navigering
    | Tangent | Åtgärd |
    |---|---|
    | Knappar ◀ / ▶ | Bakåt / Framåt i historiken |
    | Cmd/Ctrl-t | Visa/dölj innehållsförteckningspanelen |

    ### Sökning
    | Tangent | Åtgärd |
    |---|---|
    | Cmd/Ctrl-f | Öppna / stäng sökfältet |
    | Enter  eller  knapp ⬇ | Nästa träff |
    | Skift-Enter  eller  knapp ⬆ | Föregående träff |
    | Escape | Stäng sökfältet |

    > Sökningen navigerar till avsnittet som innehåller varje träff och markerar den hittade texten.
    > Den aktiva träffen visas i orange; övriga träffar i gult.

    ### Automatisk inläsning
    Visaren bevakar den öppna filen för diskändringar och läser in den automatiskt.
    Ett kort meddelande «↻ Inläst» visas i verktygsfältet efter varje automatisk inläsning.

    ### Zoom och Teckensnitt
    | Tangent | Åtgärd |
    |---|---|
    | Cmd/Ctrl-= | Zooma in |
    | Cmd/Ctrl-− | Zooma ut |
    | Cmd/Ctrl-z | Återställ zoom till 100 % |
    | Cmd/Ctrl-Skift-a | Förstora teckensnitt |
    | Cmd/Ctrl-a | Förminska teckensnitt |
    | Cmd/Ctrl-0 | Återställ teckensnitt till 100 % |

    ### Rullning (när inget textfält är fokuserat)
    | Tangent | Åtgärd |
    |---|---|
    | Upp- / nedpil | Rulla en rad |
    | Page Up / Page Down | Rulla en visningsruta (Fn-Upp / Fn-Ned på Mac) |
    | Home / Cmd-Upp | Hoppa till dokumentets början (Fn-Vänster på Mac) |
    | End / Cmd-Ned | Hoppa till dokumentets slut (Fn-Höger på Mac) |

    ### Hjälp
    | Tangent | Åtgärd |
    |---|---|
    | F1 | Visa/dölj den här hjälpskärmen |
  it: |
    # Visualizzatore Markdown — Aiuto

    ## Scorciatoie da Tastiera

    ### File
    | Tasto | Azione |
    |---|---|
    | Cmd/Ctrl-o | Apri un file Markdown |
    | Cmd/Ctrl-r | Aggiorna — ricarica il file corrente dal disco |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Esci |

    Il visualizzatore monitora il file corrente per le modifiche e lo ricarica automaticamente.
    Usa `--no-detach` o `--foreground` dalla riga di comando per mantenerlo collegato al terminale (solo Unix).

    ### Navigazione
    | Tasto | Azione |
    |---|---|
    | Pulsanti ◀ / ▶ | Indietro / Avanti nella cronologia |
    | Cmd/Ctrl-t | Mostra/nascondi il pannello del sommario |

    ### Ricerca
    | Tasto | Azione |
    |---|---|
    | Cmd/Ctrl-f | Apri / chiudi la barra di ricerca |
    | Invio  o  pulsante ⬇ | Risultato successivo |
    | Maiusc-Invio  o  pulsante ⬆ | Risultato precedente |
    | Esc | Chiudi la barra di ricerca |

    > La ricerca naviga alla sezione che contiene ogni risultato ed evidenzia il testo trovato.
    > Il risultato attivo è mostrato in arancione; gli altri in giallo.

    ### Ricarica automatica
    Il visualizzatore monitora il file aperto per le modifiche su disco e lo ricarica automaticamente.
    Un breve avviso «↻ Ricaricato» appare nella barra degli strumenti dopo ogni ricarica automatica.

    ### Zoom e Carattere
    | Tasto | Azione |
    |---|---|
    | Cmd/Ctrl-= | Ingrandisci |
    | Cmd/Ctrl-− | Riduci |
    | Cmd/Ctrl-z | Reimposta lo zoom al 100% |
    | Cmd/Ctrl-Maiusc-a | Aumenta il carattere |
    | Cmd/Ctrl-a | Riduci il carattere |
    | Cmd/Ctrl-0 | Reimposta il carattere al 100% |

    ### Scorrimento (quando nessun campo di testo è attivo)
    | Tasto | Azione |
    |---|---|
    | Freccia su / giù | Scorri di una riga |
    | Pag. su / Pag. giù | Scorri di un riquadro (Fn-Su / Fn-Giù su Mac) |
    | Inizio / Cmd-Su | Vai all'inizio del documento (Fn-Sinistra su Mac) |
    | Fine / Cmd-Giù | Vai alla fine del documento (Fn-Destra su Mac) |

    ### Aiuto
    | Tasto | Azione |
    |---|---|
    | F1 | Mostra/nascondi questa schermata di aiuto |
  pl: |
    # Przeglądarka Markdown — Pomoc

    ## Skróty Klawiaturowe

    ### Plik
    | Klawisz | Akcja |
    |---|---|
    | Cmd/Ctrl-o | Otwórz plik Markdown |
    | Cmd/Ctrl-r | Odśwież — przeładuj bieżący plik z dysku |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Wyjdź |

    Przeglądarka monitoruje bieżący plik pod kątem zmian i przeładowuje go automatycznie.
    Użyj `--no-detach` lub `--foreground` w wierszu poleceń, aby utrzymać połączenie z terminalem (tylko Unix).

    ### Nawigacja
    | Klawisz | Akcja |
    |---|---|
    | Przyciski ◀ / ▶ | Wstecz / Dalej w historii |
    | Cmd/Ctrl-t | Pokaż/ukryj panel spisu treści |

    ### Wyszukiwanie
    | Klawisz | Akcja |
    |---|---|
    | Cmd/Ctrl-f | Otwórz / zamknij pasek wyszukiwania |
    | Enter  lub  przycisk ⬇ | Następny wynik |
    | Shift-Enter  lub  przycisk ⬆ | Poprzedni wynik |
    | Escape | Zamknij pasek wyszukiwania |

    > Wyszukiwanie nawiguje do sekcji zawierającej każdy wynik i podświetla znaleziony tekst.
    > Aktywny wynik jest wyświetlany na pomarańczowo; inne na żółto.

    ### Automatyczne przeładowanie
    Przeglądarka monitoruje otwarty plik pod kątem zmian na dysku i przeładowuje go automatycznie.
    Po każdym automatycznym przeładowaniu w pasku narzędzi pojawia się krótki komunikat «↻ Przeładowano».

    ### Zoom i Czcionka
    | Klawisz | Akcja |
    |---|---|
    | Cmd/Ctrl-= | Przybliż |
    | Cmd/Ctrl-− | Oddal |
    | Cmd/Ctrl-z | Resetuj powiększenie do 100% |
    | Cmd/Ctrl-Shift-a | Powiększ czcionkę |
    | Cmd/Ctrl-a | Zmniejsz czcionkę |
    | Cmd/Ctrl-0 | Resetuj czcionkę do 100% |

    ### Przewijanie (gdy żadne pole tekstowe nie jest aktywne)
    | Klawisz | Akcja |
    |---|---|
    | Strzałka w górę / dół | Przewiń o jedną linię |
    | Page Up / Page Down | Przewiń o jeden widok (Fn-Góra / Fn-Dół na Mac) |
    | Home / Cmd-Góra | Przejdź na początek dokumentu (Fn-Lewo na Mac) |
    | End / Cmd-Dół | Przejdź na koniec dokumentu (Fn-Prawo na Mac) |

    ### Pomoc
    | Klawisz | Akcja |
    |---|---|
    | F1 | Pokaż/ukryj ten ekran pomocy |
  cs: |
    # Prohlížeč Markdown — Nápověda

    ## Klávesové Zkratky

    ### Soubor
    | Klávesa | Akce |
    |---|---|
    | Cmd/Ctrl-o | Otevřít soubor Markdown |
    | Cmd/Ctrl-r | Aktualizovat — znovu načíst aktuální soubor z disku |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Ukončit |

    Prohlížeč sleduje aktuální soubor, zda nedošlo ke změnám, a automaticky jej znovu načítá.
    Na příkazovém řádku použijte `--no-detach` nebo `--foreground`, aby zůstal připojen k terminálu (pouze Unix).

    ### Navigace
    | Klávesa | Akce |
    |---|---|
    | Tlačítka ◀ / ▶ | Zpět / Vpřed v historii |
    | Cmd/Ctrl-t | Zobrazit/skrýt panel obsahu |

    ### Hledání
    | Klávesa | Akce |
    |---|---|
    | Cmd/Ctrl-f | Otevřít / zavřít vyhledávací lištu |
    | Enter  nebo  tlačítko ⬇ | Další shoda |
    | Shift-Enter  nebo  tlačítko ⬆ | Předchozí shoda |
    | Escape | Zavřít vyhledávací lištu |

    > Hledání přejde na oddíl obsahující každou shodu a zvýrazní nalezený text.
    > Aktivní shoda je zobrazena oranžově; ostatní žlutě.

    ### Automatické znovu načítání
    Prohlížeč sleduje otevřený soubor, zda nedošlo ke změnám na disku, a automaticky jej znovu načítá.
    Po každém automatickém znovu načtení se na panelu nástrojů krátce zobrazí oznámení «↻ Znovu načteno».

    ### Zoom a Písmo
    | Klávesa | Akce |
    |---|---|
    | Cmd/Ctrl-= | Přiblížit |
    | Cmd/Ctrl-− | Oddálit |
    | Cmd/Ctrl-z | Obnovit přiblížení na 100 % |
    | Cmd/Ctrl-Shift-a | Zvětšit písmo |
    | Cmd/Ctrl-a | Zmenšit písmo |
    | Cmd/Ctrl-0 | Obnovit písmo na 100 % |

    ### Posouvání (když není zaostřeno žádné textové pole)
    | Klávesa | Akce |
    |---|---|
    | Šipka nahoru / dolů | Posunout o jeden řádek |
    | Page Up / Page Down | Posunout o jedno zobrazení (Fn-Nahoru / Fn-Dolů na Mac) |
    | Home / Cmd-Nahoru | Přejít na začátek dokumentu (Fn-Vlevo na Mac) |
    | End / Cmd-Dolů | Přejít na konec dokumentu (Fn-Vpravo na Mac) |

    ### Nápověda
    | Klávesa | Akce |
    |---|---|
    | F1 | Zobrazit/skrýt tuto obrazovku nápovědy |
