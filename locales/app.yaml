    # Markdown-visning — Hjelp

    ## Tastatursnarveier

    ### Fil
    | Tast | Handling |
    |---|---|
    | Cmd/Ctrl-o | Åpne en Markdown-fil |
    | Cmd/Ctrl-r | Oppdater — last inn gjeldende fil fra disk på nytt |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Avslutt |

    Visningen overvåker gjeldende fil for endringer og laster inn på nytt automatisk.
    Bruk `--no-detach` eller `--foreground` på kommandolinjen for å holde den tilkoblet terminalen (kun Unix).

    ### Navigasjon
    | Tast | Handling |
    |---|---|
    | Knapper ◀ / ▶ | Tilbake / Fremover i historikk |
    | Cmd/Ctrl-t | Vis/skjul innholdsfortegnelsespanel |

    ### Søk
    | Tast | Handling |
    |---|---|
    | Cmd/Ctrl-f | Åpne / lukk søkefeltet |
    | Enter  eller  knapp ⬇ | Neste treff |
    | Shift-Enter  eller  knapp ⬆ | Forrige treff |
    | Escape | Lukk søkefeltet |

    > Søk navigerer til avsnittet som inneholder hvert treff og uthever den funne teksten.
    > Det aktive treffet vises i oransje; andre treff i gult.

    ### Automatisk innlasting
    Visningen overvåker den åpne filen for diskendringer og laster inn på nytt automatisk.
    En kort «↻ Lastet inn på nytt»-melding vises i verktøylinjen etter hver automatisk innlasting.

    ### Zoom og Skrift
    | Tast | Handling |
    |---|---|
    | Cmd/Ctrl-= | Zoom inn |
    | Cmd/Ctrl-− | Zoom ut |
    | Cmd/Ctrl-z | Tilbakestill zoom til 100% |
    | Cmd/Ctrl-Shift-a | Forstørr skrift |
    | Cmd/Ctrl-a | Forminsk skrift |
    | Cmd/Ctrl-0 | Tilbakestill skriftstørrelse til 100% |

    ### Rulling (når intet tekstfelt er fokusert)
    | Tast | Handling |
    |---|---|
    | Pil opp / ned | Rull én linje |
    | Page Up / Page Down | Rull ett visningsvindu (Fn-Opp / Fn-Ned på Mac) |
    | Home / Cmd-Opp | Hopp til toppen av dokumentet (Fn-Venstre på Mac) |
    | End / Cmd-Ned | Hopp til bunnen av dokumentet (Fn-Høyre på Mac) |

    ### Hjelp
    | Tast | Handling |
    |---|---|
    | F1 | Vis/skjul denne hjelpeskjermen |
