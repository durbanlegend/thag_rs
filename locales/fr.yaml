help:
  window_title: "Aide"
  text: |
    # Visionneuse Markdown — Aide

    ## Raccourcis Clavier

    ### Fichier
    | Touche | Action |
    |---|---|
    | Cmd/Ctrl-o | Ouvrir un fichier Markdown |
    | Cmd/Ctrl-r | Actualiser — recharger le fichier depuis le disque |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Quitter |

    La visionneuse surveille le fichier courant et le recharge automatiquement en cas de modification.
    Utilisez `--no-detach` ou `--foreground` en ligne de commande pour rester attaché au terminal (Unix uniquement).

    ### Navigation
    | Touche | Action |
    |---|---|
    | Boutons ◀ / ▶ | Précédent / Suivant dans l'historique |
    | Cmd/Ctrl-t | Afficher/masquer le panneau de la table des matières |

    ### Recherche
    | Touche | Action |
    |---|---|
    | Cmd/Ctrl-f | Ouvrir / fermer la barre de recherche |
    | Entrée  ou  bouton ⬇ | Correspondance suivante |
    | Maj-Entrée  ou  bouton ⬆ | Correspondance précédente |
    | Échap | Fermer la barre de recherche |

    > La recherche navigue vers la section contenant chaque résultat et surligne le texte correspondant.
    > Le résultat actif est affiché en orange ; les autres en jaune.

    ### Rechargement automatique
    La visionneuse surveille le fichier ouvert pour détecter les modifications sur le disque et le recharge automatiquement.
    Une brève notification « ↻ Rechargé » apparaît dans la barre d'outils après chaque rechargement automatique.

    ### Zoom et Police
    | Touche | Action |
    |---|---|
    | Cmd/Ctrl-= | Zoom avant |
    | Cmd/Ctrl-− | Zoom arrière |
    | Cmd/Ctrl-z | Réinitialiser le zoom à 100 % |
    | Cmd/Ctrl-Maj-a | Agrandir la police |
    | Cmd/Ctrl-a | Réduire la police |
    | Cmd/Ctrl-0 | Réinitialiser la police à 100 % |

    ### Défilement (quand aucun champ de texte n'est actif)
    | Touche | Action |
    |---|---|
    | Flèche haut / bas | Défiler d'une ligne |
    | Page préc. / Page suiv. | Défiler d'un écran (Fn-Haut / Fn-Bas sur Mac) |
    | Début / Cmd-Haut | Aller au début du document (Fn-Gauche sur Mac) |
    | Fin / Cmd-Bas | Aller à la fin du document (Fn-Droite sur Mac) |

    ### Aide
    | Touche | Action |
    |---|---|
    | F1 | Afficher/masquer cet écran d'aide |
