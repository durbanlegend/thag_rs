    ### Навігація
    | Клавіша | Дія |
    |---|---|
    | Кнопки ◀ / ▶ | Назад / Вперед в історії |
    | Cmd/Ctrl-t | Показати/приховати панель змісту |

    ### Пошук
    | Клавіша | Дія |
    |---|---|
    | Cmd/Ctrl-f | Відкрити / закрити рядок пошуку |
    | Enter  або  кнопка ⬇ | Наступний збіг |
    | Shift-Enter  або  кнопка ⬆ | Попередній збіг |
    | Escape | Закрити рядок пошуку |

    > Пошук переходить до розділу, що містить кожен збіг, і виділяє знайдений текст.
    > Активний збіг відображається помаранчевим; інші — жовтим.

    ### Автоматичне перезавантаження
    Переглядач стежить за відкритим файлом на наявність змін на диску і перезавантажує його автоматично.
    Після кожного автоматичного перезавантаження на панелі інструментів ненадовго з'являється сповіщення «↻ Перезавантажено».

    ### Масштаб і Шрифт
    | Клавіша | Дія |
    |---|---|
    | Cmd/Ctrl-= | Збільшити масштаб |
    | Cmd/Ctrl-− | Зменшити масштаб |
    | Cmd/Ctrl-z | Скинути масштаб до 100% |
    | Cmd/Ctrl-Shift-a | Збільшити шрифт |
    | Cmd/Ctrl-a | Зменшити шрифт |
    | Cmd/Ctrl-0 | Скинути розмір шрифту до 100% |

    ### Прокрутка (коли жодне текстове поле не у фокусі)
    | Клавіша | Дія |
    |---|---|
    | Стрілка вгору / вниз | Прокрутити на один рядок |
    | Page Up / Page Down | Прокрутити на один екран (Fn-Вгору / Fn-Вниз на Mac) |
    | Home / Cmd-Вгору | Перейти на початок документа (Fn-Вліво на Mac) |
    | End / Cmd-Вниз | Перейти в кінець документа (Fn-Вправо на Mac) |

    ### Довідка
    | Клавіша | Дія |
    |---|---|
    | F1 | Показати/приховати цей екран довідки |
