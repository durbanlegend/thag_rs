    # Προβολή Markdown — Βοήθεια

    ## Συντομεύσεις Πληκτρολογίου

    ### Αρχείο
    | Πλήκτρο | Ενέργεια |
    |---|---|
    | Cmd/Ctrl-o | Άνοιγμα αρχείου Markdown |
    | Cmd/Ctrl-r | Ανανέωση — επαναφόρτωση τρέχοντος αρχείου από δίσκο |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Έξοδος |

    Η προβολή παρακολουθεί το τρέχον αρχείο για αλλαγές και το επαναφορτώνει αυτόματα.
    Χρησιμοποιήστε `--no-detach` ή `--foreground` στη γραμμή εντολών για να παραμείνει συνδεδεμένο με τον τερματικό (μόνο Unix).

    ### Πλοήγηση
    | Πλήκτρο | Ενέργεια |
    |---|---|
    | Κουμπιά ◀ / ▶ | Πίσω / Μπροστά στο ιστορικό |
    | Cmd/Ctrl-t | Εναλλαγή πίνακα περιεχομένων |

    ### Αναζήτηση
    | Πλήκτρο | Ενέργεια |
    |---|---|
    | Cmd/Ctrl-f | Άνοιγμα / κλείσιμο γραμμής αναζήτησης |
    | Enter  ή  κουμπί ⬇ | Επόμενη αντιστοιχία |
    | Shift-Enter  ή  κουμπί ⬆ | Προηγούμενη αντιστοιχία |
    | Escape | Κλείσιμο γραμμής αναζήτησης |

    > Η αναζήτηση πλοηγείται στην ενότητα που περιέχει κάθε αντιστοιχία και επισημαίνει το βρεθέν κείμενο.
    > Η ενεργή αντιστοιχία εμφανίζεται πορτοκαλί· οι άλλες κίτρινο.

    ### Αυτόματη επαναφόρτωση
    Η προβολή παρακολουθεί το ανοιχτό αρχείο για αλλαγές στον δίσκο και το επαναφορτώνει αυτόματα.
    Μια σύντομη ειδοποίηση «↻ Επαναφορτώθηκε» εμφανίζεται στη γραμμή εργαλείων μετά από κάθε αυτόματη επαναφόρτωση.

    ### Ζουμ και Γραμματοσειρά
    | Πλήκτρο | Ενέργεια |
    |---|---|
    | Cmd/Ctrl-= | Μεγέθυνση |
    | Cmd/Ctrl-− | Σμίκρυνση |
    | Cmd/Ctrl-z | Επαναφορά ζουμ στο 100% |
    | Cmd/Ctrl-Shift-a | Μεγέθυνση γραμματοσειράς |
    | Cmd/Ctrl-a | Σμίκρυνση γραμματοσειράς |
    | Cmd/Ctrl-0 | Επαναφορά μεγέθους γραμματοσειράς στο 100% |

    ### Κύλιση (όταν δεν υπάρχει εστιασμένο πεδίο κειμένου)
    | Πλήκτρο | Ενέργεια |
    |---|---|
    | Βέλος πάνω / κάτω | Κύλιση μίας γραμμής |
    | Page Up / Page Down | Κύλιση μίας οθόνης (Fn-Πάνω / Fn-Κάτω σε Mac) |
    | Home / Cmd-Πάνω | Μετάβαση στην αρχή του εγγράφου (Fn-Αριστερά σε Mac) |
    | End / Cmd-Κάτω | Μετάβαση στο τέλος του εγγράφου (Fn-Δεξιά σε Mac) |

    ### Βοήθεια
    | Πλήκτρο | Ενέργεια |
    |---|---|
    | F1 | Εναλλαγή αυτής της οθόνης βοήθειας |
