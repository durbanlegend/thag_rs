    # Просмотрщик Markdown — Помощь

    ## Сочетания Клавиш

    ### Файл
    | Клавиша | Действие |
    |---|---|
    | Cmd/Ctrl-o | Открыть файл Markdown |
    | Cmd/Ctrl-r | Обновить — перезагрузить текущий файл с диска |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Выйти |

    Просмотрщик отслеживает изменения в текущем файле и перезагружает его автоматически.
    Используйте `--no-detach` или `--foreground` в командной строке, чтобы оставить его подключённым к терминалу (только Unix).

    ### Навигация
    | Клавиша | Действие |
    |---|---|
    | Кнопки ◀ / ▶ | Назад / Вперёд в истории |
    | Cmd/Ctrl-t | Показать/скрыть панель оглавления |

    ### Поиск
    | Клавиша | Действие |
    |---|---|
    | Cmd/Ctrl-f | Открыть / закрыть строку поиска |
    | Enter  или  кнопка ⬇ | Следующее совпадение |
    | Shift-Enter  или  кнопка ⬆ | Предыдущее совпадение |
    | Escape | Закрыть строку поиска |

    > Поиск переходит к разделу, содержащему каждое совпадение, и выделяет найденный текст.
    > Активное совпадение отображается оранжевым; остальные — жёлтым.

    ### Автоматическая перезагрузка
    Просмотрщик отслеживает изменения открытого файла на диске и перезагружает его автоматически.
    После каждой автоматической перезагрузки на панели инструментов кратко появляется уведомление «↻ Перезагружено».

    ### Масштаб и Шрифт
    | Клавиша | Действие |
    |---|---|
    | Cmd/Ctrl-= | Увеличить масштаб |
    | Cmd/Ctrl-− | Уменьшить масштаб |
    | Cmd/Ctrl-z | Сбросить масштаб до 100% |
    | Cmd/Ctrl-Shift-a | Увеличить шрифт |
    | Cmd/Ctrl-a | Уменьшить шрифт |
    | Cmd/Ctrl-0 | Сбросить шрифт до 100% |

    ### Прокрутка (когда ни одно текстовое поле не в фокусе)
    | Клавиша | Действие |
    |---|---|
    | Стрелка вверх / вниз | Прокрутить на одну строку |
    | Page Up / Page Down | Прокрутить на один экран (Fn-Вверх / Fn-Вниз на Mac) |
    | Home / Cmd-Вверх | Перейти в начало документа (Fn-Влево на Mac) |
    | End / Cmd-Вниз | Перейти в конец документа (Fn-Вправо на Mac) |

    ### Помощь
    | Клавиша | Действие |
    |---|---|
    | F1 | Показать/скрыть этот экран помощи |
