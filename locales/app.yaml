    # Markdown-viewer — Help

    ## Sneltoetsen

    ### Bestand
    | Toets | Actie |
    |---|---|
    | Cmd/Ctrl-o | Een Markdown-bestand openen |
    | Cmd/Ctrl-r | Vernieuwen — het huidige bestand opnieuw laden van schijf |
    | Cmd/Ctrl-w  /  Cmd/Ctrl-q | Afsluiten |

    De viewer bewaakt het huidige bestand op wijzigingen en laadt het automatisch opnieuw.
    Gebruik `--no-detach` of `--foreground` op de opdrachtregel om het verbonden te houden met de terminal (alleen Unix).

    ### Navigatie
    | Toets | Actie |
    |---|---|
    | Knoppen ◀ / ▶ | Terug / Vooruit in geschiedenis |
    | Cmd/Ctrl-t | Inhoudsopgave-paneel in-/uitschakelen |

    ### Zoeken
    | Toets | Actie |
    |---|---|
    | Cmd/Ctrl-f | Zoekbalk openen / sluiten |
    | Enter  of  knop ⬇ | Volgende overeenkomst |
    | Shift-Enter  of  knop ⬆ | Vorige overeenkomst |
    | Escape | Zoekbalk sluiten |

    > Zoeken navigeert naar het gedeelte dat elke overeenkomst bevat en markeert de gevonden tekst.
    > De actieve overeenkomst wordt oranje weergegeven; andere geel.

    ### Automatisch herladen
    De viewer bewaakt het geopende bestand op wijzigingen op schijf en laadt het automatisch opnieuw.
    Na elk automatisch herladen verschijnt kort een «↻ Opnieuw geladen»-melding in de werkbalk.

    ### Zoom en Lettertype
    | Toets | Actie |
    |---|---|
    | Cmd/Ctrl-= | Inzoomen |
    | Cmd/Ctrl-− | Uitzoomen |
    | Cmd/Ctrl-z | Zoom terugzetten naar 100% |
    | Cmd/Ctrl-Shift-a | Lettertype vergroten |
    | Cmd/Ctrl-a | Lettertype verkleinen |
    | Cmd/Ctrl-0 | Lettergrootte terugzetten naar 100% |

    ### Scrollen (wanneer geen tekstveld gefocust is)
    | Toets | Actie |
    |---|---|
    | Pijl omhoog / omlaag | Één regel scrollen |
    | Page Up / Page Down | Één viewport scrollen (Fn-Omhoog / Fn-Omlaag op Mac) |
    | Home / Cmd-Omhoog | Naar het begin van het document (Fn-Links op Mac) |
    | End / Cmd-Omlaag | Naar het einde van het document (Fn-Rechts op Mac) |

    ### Help
    | Toets | Actie |
    |---|---|
    | F1 | Dit helpscherm in-/uitschakelen |
