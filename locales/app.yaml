status.large_file_tip:
  af: "Groot lêer — aanvanklike weergawe is stadig. Blaairesponsiwiteit verbeter sodra die dokument volledig uitgelê is."
  bg: "Голям файл — първоначалното изобразяване е бавно. Реактивността на превъртането се подобрява след пълното зареждане на документа."
  ca: "Fitxer gran — la representació inicial és lenta. La resposta al desplaçament millora un cop el document ha estat completament composat."
  cs: "Velký soubor — první vykreslení je pomalé. Odezva posouvání se zlepší po úplném rozložení dokumentu."
  cy: "Ffeil fawr — mae'r rendrad cyntaf yn araf. Mae ymatebedd sgrolio yn gwella unwaith y bydd y ddogfen wedi'i gosod yn llawn."
  da: "Stor fil — den første gengivelse er langsom. Scrollresponstiden forbedres, når dokumentet er fuldt lagt ud."
  de: "Große Datei — die erste Darstellung ist langsam. Die Scroll-Reaktion verbessert sich, sobald das Dokument vollständig gelayoutet ist."
  el: "Μεγάλο αρχείο — η αρχική απόδοση είναι αργή. Η ανταπόκριση κύλισης βελτιώνεται μόλις φορτωθεί πλήρως το έγγραφο."
  en: "Large file — initial render is slow. Scroll responsiveness improves once the document is fully laid out."
  es: "Archivo grande — el renderizado inicial es lento. La capacidad de respuesta al desplazamiento mejora una vez que el documento está completamente maquetado."
  fi: "Suuri tiedosto — ensimmäinen renderöinti on hidas. Vierityksen vasteaika paranee, kun asiakirja on kokonaan ladattu."
  fr: "Fichier volumineux — le rendu initial est lent. La réactivité du défilement s'améliore une fois le document entièrement mis en page."
  hr: "Velika datoteka — prvo prikazivanje je sporo. Odziv pomicanja poboljšava se kada je dokument u potpunosti prikazan."
  hu: "Nagy fájl — a kezdeti megjelenítés lassú. A görgetési válaszidő javul, miután a dokumentum teljesen be van töltve."
  it: "File grande — la resa iniziale è lenta. La reattività allo scorrimento migliora una volta che il documento è completamente impaginato."
  nb: "Stor fil — første gjengivelse er treg. Rulleresponsen forbedres når dokumentet er fullt lagt ut."
  nl: "Groot bestand — het eerste renderen is traag. De scrollresponsiviteit verbetert zodra het document volledig is opgemaakt."
  no: "Stor fil — første gjengivelse er treg. Rulleresponsen forbedres når dokumentet er fullt lagt ut."
  pl: "Duży plik — pierwsze renderowanie jest wolne. Responsywność przewijania poprawia się po całkowitym załadowaniu dokumentu."
  pt: "Arquivo grande — a renderização inicial é lenta. A resposta de rolagem melhora após o documento ser completamente carregado."
  ro: "Fișier mare — redarea inițială este lentă. Capacitatea de reacție la derulare se îmbunătățește odată ce documentul este complet afișat."
  ru: "Большой файл — первоначальный рендеринг выполняется медленно. Отклик прокрутки улучшается после полной загрузки документа."
  sk: "Veľký súbor — prvé vykreslenie je pomalé. Odozva posúvania sa zlepší po úplnom rozložení dokumentu."
  sl: "Velika datoteka — začetno upodabljanje je počasno. Odzivnost pomikanja se izboljša, ko je dokument v celoti prikazan."
  st: "Faele e kgolo — ho bontša ha mathomo ho pata. Ho araba ha ho potoloha ho ntlafala ha tokomane e tsotlehilwe ka botlalo."
  sv: "Stor fil — den första renderingen är långsam. Rullningens svarstid förbättras när dokumentet är helt layoutat."
  uk: "Великий файл — початковий рендеринг повільний. Чутливість прокрутки покращується після повного завантаження документа."
  xh: "Ifayile enkulu — ukulayisha kokuqala kuyachitha. Ukusabela kokuskrola kuyathuthuka xa idokhumenti ilayishiwe ngokupheleleyo."
  zu: "Ifayili enkulu — ukusebenza kokuqala kuyahamba kancane. Ukusabela kokuskrola kuyathuthuka uma idokhumenti ilayishwe ngokugcwele."

